name: Bug report
description: A tool fails or behaves unexpectedly
labels: [bug]
body:
  - type: input
    id: adapter
    attributes:
      label: Adapter
      description: Make and model, for example TP-Link Archer T2U Plus
    validations:
      required: true
  - type: textarea
    id: usbprobe
    attributes:
      label: usbprobe output
      description: Output of `./usbprobe`
      render: text
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      description: For example MacBook Air M3, macOS 27.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and its full output. Remove passwords; do not include captures of networks you do not own.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
