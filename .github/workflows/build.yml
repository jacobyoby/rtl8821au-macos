name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner; the Makefile builds for arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: brew install libusb pkg-config

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Self-tests
        run: make check
